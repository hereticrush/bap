# ──────────────────────────────────────────────
# bap — Docker Compose (Production / VPS)
#
# Services:
#   app   — Go application (scheduler + workers + health server)
#   redis — Asynq message broker
# ──────────────────────────────────────────────

services:
  app:
    build: .
    image: ghcr.io/hereticrush/bap:latest
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      - ACTIVE_AI_PROVIDER=RUNWAY
      - ACTIVE_PROMPT_BUILDER=GEMINI
      - REDIS_URL=redis://redis:6379
    ports:
      - "127.0.0.1:8081:8081"    # /healthz — localhost only
    volumes:
      - ./data:/app/data                          # SQLite database persistence
      - ./credentials:/app/credentials:ro         # Credentials (YouTube etc)
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    image: ghcr.io/hereticrush/bap-crawler:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      - redis

volumes:
  redis_data:
